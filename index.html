<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Monkeys</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Ending pages go up top -->
    <div id="ending-div" style="display: none"></div>
    <div id="dev-mode" style="display: none"></div>
    <div id="hud">
      <h3 id="cash-display">Cash: $1000</h3>
      <h3 id="monkeys-display">Monkeys: 0</h3>

      <p>
        <span id="passage-to-match"><b>Passage:</b></span>
        <br>
        <form id="updatePassageForm">
          <input
            type="text"
            id="change-passage"
            placeholder="Update Passage?"
            minlength="15">
          <input type="submit">
        </form>
      </p>
      <p id="generations"><b>Attempts:</b> 0</p>
      <p id="ETA"><b>ETA: </b>Never</p>
      <p id="cash-per-second"><b>Cash/sec: </b>0</p>
      <p id="top-scoring-monkey" style="display: none">Top Scoring Monkey:</p>
      <p id="best-passage" style="display: none"><b>Best Passage:</b></p>
      <h3 id="autoclickers-display" style="display: none">Autoclickers: 0</h3>
      <div class="shop-area">
        <div id="monkey-shop"></div>
        <div class="utility-shop">
           <div id="buy-autoclicker-button" style="display: none"><button>Buy Autoclicker: $2000</button></div>
        </div>
      </div>
    </div>
    <br />
    <!-- Monkeys (and packs thereof) go here. -->
    <div id="monkeydiv"></div>
    <script type="module" src="js/main.js" defer></script>
  </body>
</html>
